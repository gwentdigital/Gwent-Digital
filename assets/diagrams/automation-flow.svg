<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 300" width="1260" height="300" role="img" aria-labelledby="af-t af-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="af-t">How our outreach automation runs</title>
  <desc id="af-d">Six stages: find prospects, draft the message, a human approves, send, log to the record, then report. Nothing sends without the approval stage.</desc>
  <defs>
    <linearGradient id="af-line" x1="0" y1="0" x2="1260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7BA428"/><stop offset="1" stop-color="#A6CB5E"/>
    </linearGradient>
    <marker id="af-arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
    <style>
      .af-n  { font: 600 15px Poppins, Montserrat, system-ui, sans-serif; fill:#14181F; }
      .af-s  { font: 400 12.5px Inter, system-ui, sans-serif; fill:#64748B; }
      .af-w  { font: 600 15px Poppins, Montserrat, system-ui, sans-serif; fill:#FFFFFF; }
      .af-ws { font: 400 12.5px Inter, system-ui, sans-serif; fill:#F5F7F7; }
      .af-k  { font: 600 11px Inter, system-ui, sans-serif; fill:#14181F; letter-spacing:.4px; }
    </style>
  </defs>

  <rect width="1260" height="300" rx="18" fill="#F1F5F9"/>
  <rect x="24" y="24" width="1212" height="3" rx="1.5" fill="url(#af-line)"/>

  <g stroke="#94A3B8" stroke-width="1.6" marker-end="url(#af-arw)">
    <line x1="208" y1="150" x2="238" y2="150"/>
    <line x1="410" y1="150" x2="440" y2="150"/>
    <line x1="612" y1="150" x2="642" y2="150"/>
    <line x1="838" y1="150" x2="868" y2="150"/>
    <line x1="1040" y1="150" x2="1070" y2="150"/>
  </g>

  <g>
    <rect x="24" y="100" width="184" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3EC"/>
    <rect x="24" y="100" width="4" height="100" rx="2" fill="#7BA428"/>
    <text class="af-n" x="46" y="136">Find</text>
    <text class="af-s" x="46" y="160">Local businesses that</text>
    <text class="af-s" x="46" y="178">match your customer</text>
  </g>
  <g>
    <rect x="238" y="100" width="172" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3EC"/>
    <rect x="238" y="100" width="4" height="100" rx="2" fill="#7BA428"/>
    <text class="af-n" x="260" y="136">Draft</text>
    <text class="af-s" x="260" y="160">A message written</text>
    <text class="af-s" x="260" y="178">for that one business</text>
  </g>

  <g>
    <rect x="440" y="88" width="172" height="124" rx="14" fill="#14181F"/>
    <rect x="440" y="88" width="172" height="124" rx="14" fill="none" stroke="#A6CB5E" stroke-width="2"/>
    <rect x="456" y="104" width="86" height="20" rx="10" fill="#A6CB5E"/>
    <text class="af-k" x="466" y="118">you decide</text>
    <text class="af-w" x="456" y="152">Approve</text>
    <text class="af-ws" x="456" y="176">Nothing leaves here</text>
    <text class="af-ws" x="456" y="194">without your yes</text>
  </g>

  <g>
    <rect x="642" y="100" width="196" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3EC"/>
    <rect x="642" y="100" width="4" height="100" rx="2" fill="#7BA428"/>
    <text class="af-n" x="664" y="136">Send</text>
    <text class="af-s" x="664" y="160">From your own domain,</text>
    <text class="af-s" x="664" y="178">spaced out, not blasted</text>
  </g>
  <g>
    <rect x="868" y="100" width="172" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3EC"/>
    <rect x="868" y="100" width="4" height="100" rx="2" fill="#7BA428"/>
    <text class="af-n" x="890" y="136">Log</text>
    <text class="af-s" x="890" y="160">Every contact stored,</text>
    <text class="af-s" x="890" y="178">opt-outs honoured</text>
  </g>
  <g>
    <rect x="1070" y="100" width="166" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3EC"/>
    <rect x="1070" y="100" width="4" height="100" rx="2" fill="#A6CB5E"/>
    <text class="af-n" x="1092" y="136">Report</text>
    <text class="af-s" x="1092" y="160">Replies and results,</text>
    <text class="af-s" x="1092" y="178">weekly</text>
  </g>

  <text class="af-s" x="24" y="266">Data held in the UK. Contacts can opt out at any time, and opt-outs are permanent.</text>
</svg>
