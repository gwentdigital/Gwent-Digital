<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-labelledby="sb-t sb-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="sb-t">How the social media manager works</title>
  <desc id="sb-d">Five stages: ideas from your business, captions drafted in your voice, you approve, posts are scheduled, then results come back. You approve before anything is published.</desc>
  <defs>
    <linearGradient id="sb-line" x1="0" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <marker id="sb-arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
    <style>
      .sb-n  { font: 600 15px Poppins, Montserrat, system-ui, sans-serif; fill:#0B1F3B; }
      .sb-s  { font: 400 12.5px Inter, system-ui, sans-serif; fill:#64748B; }
      .sb-w  { font: 600 15px Poppins, Montserrat, system-ui, sans-serif; fill:#FFFFFF; }
      .sb-ws { font: 400 12.5px Inter, system-ui, sans-serif; fill:#BAE6FD; }
      .sb-k  { font: 600 11px Inter, system-ui, sans-serif; fill:#0B1F3B; letter-spacing:.4px; }
    </style>
  </defs>

  <rect width="1100" height="300" rx="18" fill="#F1F5F9"/>
  <rect x="24" y="24" width="1052" height="3" rx="1.5" fill="url(#sb-line)"/>

  <g stroke="#94A3B8" stroke-width="1.6" marker-end="url(#sb-arw)">
    <line x1="214" y1="150" x2="244" y2="150"/>
    <line x1="426" y1="150" x2="456" y2="150"/>
    <line x1="628" y1="150" x2="658" y2="150"/>
    <line x1="850" y1="150" x2="880" y2="150"/>
  </g>

  <g>
    <rect x="24" y="100" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3EC"/>
    <rect x="24" y="100" width="4" height="100" rx="2" fill="#2563EB"/>
    <text class="sb-n" x="46" y="136">Ideas</text>
    <text class="sb-s" x="46" y="160">Built from your offers,</text>
    <text class="sb-s" x="46" y="178">menu and quiet days</text>
  </g>
  <g>
    <rect x="244" y="100" width="182" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3EC"/>
    <rect x="244" y="100" width="4" height="100" rx="2" fill="#2563EB"/>
    <text class="sb-n" x="266" y="136">Caption</text>
    <text class="sb-s" x="266" y="160">Written to sound like</text>
    <text class="sb-s" x="266" y="178">you, not like a robot</text>
  </g>
  <g>
    <rect x="456" y="88" width="172" height="124" rx="14" fill="#0B1F3B"/>
    <rect x="456" y="88" width="172" height="124" rx="14" fill="none" stroke="#06B6D4" stroke-width="2"/>
    <rect x="472" y="104" width="86" height="20" rx="10" fill="#06B6D4"/>
    <text class="sb-k" x="482" y="118">you decide</text>
    <text class="sb-w" x="472" y="152">Approve</text>
    <text class="sb-ws" x="472" y="176">Edit or bin it</text>
    <text class="sb-ws" x="472" y="194">before it goes out</text>
  </g>
  <g>
    <rect x="658" y="100" width="192" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3EC"/>
    <rect x="658" y="100" width="4" height="100" rx="2" fill="#2563EB"/>
    <text class="sb-n" x="680" y="136">Schedule</text>
    <text class="sb-s" x="680" y="160">Posted at the hours</text>
    <text class="sb-s" x="680" y="178">your customers are on</text>
  </g>
  <g>
    <rect x="880" y="100" width="196" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3EC"/>
    <rect x="880" y="100" width="4" height="100" rx="2" fill="#06B6D4"/>
    <text class="sb-n" x="902" y="136">Results</text>
    <text class="sb-s" x="902" y="160">What landed, what did</text>
    <text class="sb-s" x="902" y="178">not, and what to repeat</text>
  </g>

  <text class="sb-s" x="24" y="266">Service we build for clients. Your accounts stay yours — we never take ownership of a page.</text>
</svg>
