<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="gd-mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="gd-mark">Gwent Digital mark</title>
  <defs>
    <linearGradient id="gd-ring" x1="14" y1="24" x2="150" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1F3B"/>
      <stop offset="0.7" stop-color="#132B52"/>
      <stop offset="1" stop-color="#0B1F3B"/>
