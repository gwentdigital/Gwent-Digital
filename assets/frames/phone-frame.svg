<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780" role="img" aria-labelledby="pf-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="pf-title">Phone containing a mobile screenshot</title>
  <defs><clipPath id="pf-screen"><rect x="14" y="14" width="352" height="752" rx="34"/></clipPath></defs>
  <rect width="380" height="780" rx="46" fill="#0B1F3B"/>
  <!-- Replace href with your screenshot. Keep x/y/width/height exactly as-is. -->
  <image href="REPLACE-ME.png" x="14" y="14" width="352" height="752"
         preserveAspectRatio="xMidYMin slice" clip-path="url(#pf-screen)"/>
  <rect x="14" y="14" width="352" height="752" rx="34" fill="none" stroke="#06B6D4" stroke-opacity="0.45"/>
  <rect x="150" y="22" width="80" height="17" rx="8.5" fill="#0B1F3B"/>
  <rect x="160" y="750" width="60" height="4" rx="2" fill="#FFFFFF" opacity="0.45"/>
</svg>
