<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="bf-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bf-title">Browser window containing a website screenshot</title>
  <defs>
    <clipPath id="bf-screen"><rect x="14" y="58" width="1172" height="728" rx="4"/></clipPath>
    <clipPath id="bf-body"><rect width="1200" height="800" rx="16"/></clipPath>
    <linearGradient id="bf-edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7BA428"/><stop offset="1" stop-color="#A6CB5E"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#bf-body)">
    <rect width="1200" height="800" fill="#14181F"/>
    <!-- Replace href with your screenshot. Keep x/y/width/height exactly as-is. -->
    <image href="REPLACE-ME.png" x="14" y="58" width="1172" height="728"
           preserveAspectRatio="xMidYMin slice" clip-path="url(#bf-screen)"/>
    <circle cx="34" cy="30" r="5.5" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="55" cy="30" r="5.5" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="76" cy="30" r="5.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="104" y="18" width="330" height="24" rx="12" fill="#FFFFFF" opacity="0.08"/>
    <text x="120" y="34" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5"
          fill="#FFFFFF" opacity="0.6">gwentdigital.co.uk</text>
    <rect x="14" y="56" width="1172" height="2" fill="url(#bf-edge)"/>
  </g>
</svg>
