[build]
  publish = "."
  command = ""

# Enquiries use Netlify Forms; no unconfigured admin proxy.

# Netlify serves /404.html automatically for unmatched paths â€” no rule needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
